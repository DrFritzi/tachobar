# Called by release.yml (cargo-dist `publish-jobs`) after the GitHub release
# is created. Publishes the crate to crates.io with Trusted Publishing: a
# short-lived token is minted via GitHub OIDC for this run only, so no
# long-lived crates.io API token is stored in the repository.
#
# One-time setup (see CONTRIBUTING.md): configure this repository and the
# workflow file `release.yml` with environment `crates-io` as a trusted
# publisher on crates.io.
name: Publish to crates.io

on:
  workflow_call:
    inputs:
      plan:
        required: true
        type: string

permissions: {}

jobs:
  publish:
    runs-on: ubuntu-22.04
    # Protected environment: restrict to tags / add required reviewers in
    # the repository settings.
    environment: crates-io
    permissions:
      contents: read
      id-token: write # OIDC token exchange with crates.io
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: stable
      - name: Authenticate with crates.io (OIDC)
        id: auth
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1
      - name: Publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: cargo publish --locked
