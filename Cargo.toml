[package]
name = "tachobar"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "Cross-platform Claude Code status line with accurate costs (cache tiers, subagents) in any currency"
authors = ["DrFritzi"]
license = "MIT"
repository = "https://github.com/DrFritzi/tachobar"
homepage = "https://github.com/DrFritzi/tachobar"
readme = "README.md"
# Distributed as prebuilt binaries via GitHub releases, not crates.io.
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
webpki-roots = "1"
toml = { version = "1", default-features = false, features = ["std", "serde", "parse"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"

# Build release artifacts even though the crate is not published to crates.io
[package.metadata.dist]
dist = true
