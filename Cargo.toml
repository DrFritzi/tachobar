[package]
name = "tachobar"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "Cross-platform Claude Code status line with accurate costs (cache tiers, subagents) in any currency"
authors = ["DrFritzi"]
license = "MIT"
repository = "https://github.com/DrFritzi/tachobar"
homepage = "https://github.com/DrFritzi/tachobar"
readme = "README.md"
# Distributed as prebuilt binaries via GitHub releases, not crates.io.
publish = false
keywords = ["claude", "claude-code", "statusline", "cost", "cli"]
categories = ["command-line-utilities", "development-tools"]
include = ["src/**/*", "data/**/*", "Cargo.toml", "README.md", "LICENSE", "CHANGELOG.md"]

[dependencies]
dirs = "6"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip"] }
toml = { version = "1", default-features = false, features = ["std", "serde", "parse"] }
ureq = { version = "3", default-features = false, features = ["rustls", "platform-verifier"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
opt-level = 3

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"

# Build release artifacts even though the crate is not published to crates.io
[package.metadata.dist]
dist = true
