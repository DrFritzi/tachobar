[workspace]
members = ["cargo:."]

# Config for 'dist'
[dist]
# The preferred dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.32.0"
# CI backends to support
ci = "github"
# The installers to generate for each app
installers = ["shell"]
# Target platforms to build apps for (Rust target-triple syntax)
targets = [
    "aarch64-apple-darwin",
    "x86_64-apple-darwin",
    "aarch64-unknown-linux-musl",
    "x86_64-unknown-linux-musl",
    "aarch64-pc-windows-msvc",
    "x86_64-pc-windows-msvc",
]
# Path that installers should place binaries in
install-path = "CARGO_HOME"
# Whether to install an updater program
install-updater = false
# Ship the third-party licence notices in every archive
include = ["THIRD-PARTY-LICENSES.md"]
# Release by running the Release workflow with a tag input; the workflow
# creates the tag and the GitHub release itself
dispatch-releases = true
# Signed build provenance for every release artifact (verify with `gh attestation verify`)
github-attestations = true

# Pin third-party actions in the generated release workflow to full commit SHAs
[dist.github-action-commits]
"actions/checkout" = "3d3c42e5aac5ba805825da76410c181273ba90b1" # v7.0.1
"actions/upload-artifact" = "043fb46d1a93c77aae656e7c1c64a875d1fc6a0a" # v7
"actions/download-artifact" = "3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c" # v8
"actions/attest" = "1e69f48acb82d1966a394da916b4c1698aa569d6" # v4

# ring's C code cannot be cross-compiled for Windows arm64 by cargo-xwin, so
# build that target natively.
[dist.github-custom-runners]
aarch64-pc-windows-msvc = "windows-2022"
